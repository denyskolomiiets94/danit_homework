apiVersion: apps/v1
kind: Deployment
metadata:
  name: random-string
spec:
  replicas: 3
  selector:
    matchLabels:
      app: random-string
  template:
    metadata:
      labels:
        app: random-string
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: random-string
          image: jonnydonnybonny2112/random-string:1.0
          ports:
            - containerPort: 8082