
name: Build and Push Docker Image

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - 'Final_step_project/app/**'
      - '.github/workflows/docker-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Final_step_project/app
          push: true
          tags: |
            jonnydonnybonny2112/final-step-app:latest
            jonnydonnybonny2112/final-step-app:${{ github.sha }}

      - name: Update Kubernetes image tag
        run: |
          sed -i "s|image: jonnydonnybonny2112/final-step-app:.*|image: jonnydonnybonny2112/final-step-app:${{ github.sha }}|" Final_step_project/k8s/deployment.yaml

      - name: Commit and push updated image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Final_step_project/k8s/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "ci: update Docker image tag to ${{ github.sha }}"
          git push
