
apiVersion: apps/v1
kind: Deployment

metadata:
  name: final-step-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: final-step-app

  template:
    metadata:
      labels:
        app: final-step-app

    spec:
      containers:
        - name: final-step-app
          image: jonnydonnybonny2112/final-step-app:66f3070b92a7da270d88f1e78afb1f9d73ca4266
          ports:
            - containerPort: 8080
