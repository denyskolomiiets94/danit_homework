
apiVersion: apps/v1
kind: Deployment

metadata:
  name: final-step-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: final-step-app

  template:
    metadata:
      labels:
        app: final-step-app

    spec:
      containers:
        - name: final-step-app
          image: jonnydonnybonny2112/final-step-app:d772e13a1da266d75f85adde4a6e4062ed7f24dc
          ports:
            - containerPort: 8080
