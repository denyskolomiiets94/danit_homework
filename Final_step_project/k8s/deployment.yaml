
apiVersion: apps/v1
kind: Deployment

metadata:
  name: final-step-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: final-step-app

  template:
    metadata:
      labels:
        app: final-step-app

    spec:
      containers:
        - name: final-step-app
          image: jonnydonnybonny2112/final-step-app:cda10e6ce659b7336a6c2afd0b57aadeff52d407
          ports:
            - containerPort: 8080
