
apiVersion: apps/v1
kind: Deployment

metadata:
  name: final-step-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: final-step-app

  template:
    metadata:
      labels:
        app: final-step-app

    spec:
      containers:
        - name: final-step-app
          image: jonnydonnybonny2112/final-step-app:b5d034f5f2c6af22c6eefe5de735f5df5ae0906f
          ports:
            - containerPort: 8080
