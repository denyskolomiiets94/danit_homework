
apiVersion: apps/v1
kind: Deployment

metadata:
  name: final-step-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: final-step-app

  template:
    metadata:
      labels:
        app: final-step-app

    spec:
      containers:
        - name: final-step-app
          image: jonnydonnybonny2112/final-step-app:fdc06ba22c5f203d6708d36ab1a43f8477c0a96d
          ports:
            - containerPort: 8080
