
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: final-step-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/denyskolomiiets94/danit_homework.git
    targetRevision: main
    path: Final_step_project/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
