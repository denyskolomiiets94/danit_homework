
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: final-step-app-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/group.name: student1


spec:
  ingressClassName: alb

  rules:
    - host: app.jimbo-devops.pp.ua
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: final-step-app-service
                port:
                  number: 80
